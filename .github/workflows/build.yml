name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get JAR info
        id: jar
        run: |
          JAR_PATH=$(ls build/libs/ChaosCraft-*.jar | head -1)
          JAR_NAME=$(basename "$JAR_PATH")
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$JAR_NAME" >> "$GITHUB_OUTPUT"

      - name: Update release/ folder with dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp ${{ steps.jar.outputs.path }} release/ChaosCraft-latest.jar
          cp ${{ steps.jar.outputs.path }} release/ChaosCraft-dev-${{ github.run_number }}.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/
          git commit -m "Dev build #${{ github.run_number }} — ${{ steps.jar.outputs.name }}" || echo "No changes"
          git push origin HEAD:main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChaosCraft-dev-${{ github.run_number }}
          path: build/libs/ChaosCraft-*.jar
          retention-days: 14
