name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get JAR name and version
        id: jar
        run: |
          JAR_PATH=$(ls build/libs/ChaosCraft-*.jar | head -1)
          JAR_NAME=$(basename "$JAR_PATH")
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$JAR_NAME" >> "$GITHUB_OUTPUT"

      - name: Copy JAR to release/ folder in repo
        run: |
          mkdir -p release
          cp ${{ steps.jar.outputs.path }} release/${{ steps.jar.outputs.name }}
          # Also keep a latest.jar symlink-style copy for easy downloading
          cp ${{ steps.jar.outputs.path }} release/ChaosCraft-latest.jar

      - name: Commit release JAR to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/
          git commit -m "Release ${{ github.ref_name }} — ${{ steps.jar.outputs.name }}" || echo "No changes"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
