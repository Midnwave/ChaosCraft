custom-model-data:
  "off": 39001
  charging: 39002
  active: 39003
  rage: 39004

# ============================================================
# STATE: OFF
# ============================================================
off:
  name: "&5&lC&d&le&b&ll&3&le&9&ls&b&lt&d&li&5&la&d&ll &b&lI&3&lv&9&lo&b&lr&d&ly"
  attack-speed: 48.0
  right-click-to-charge: true

# ============================================================
# STATE: CHARGING
# ============================================================
charging:
  name: "&5&lC&d&le&b&ll&3&le&9&ls&b&lt&d&li&5&la&d&ll &b&lI&3&lv&9&lo&b&lr&d&ly"
  attack-speed: 48.0
  charge-duration-ticks: 140
  charge-script:
    - 'execute console command "execute in %world% run playsound minecraft:chaoscraft.ivorycharging player @a %x% %y% %z% 2.0 1.0"'
    - 'wait 140'
    - 'finish'

# ============================================================
# STATE: ACTIVE
# ============================================================
active:
  name: "&5&lC&d&le&b&ll&3&le&9&ls&b&lt&d&li&5&la&d&ll &b&lI&3&lv&9&lo&b&lr&d&ly"
  attack-cooldown-seconds: 4.0
  base-damage: 15000
  knockback:
    horizontal: 1.5
    vertical: 0.5
  sounds:
    swing: "minecraft:chaoscraft.ivoryswing"
    swing-volume: 2.0
    swing-pitch: 1.0
    hit: "minecraft:chaoscraft.ivoryattack"
    hit-volume: 2.5
    hit-pitch: 1.0
  hit-effects:
    screen-shake:
      enabled: true
    lightning:
      enabled: true
      invisible-bolt: false
    white-flash:
      enabled: true
      duration-ticks: 20
    particles:
      enabled: true
  on-hit-script:
    - 'execute console command "execute in %world% run summon minecraft:lightning_bolt %x% 250 %z%"'
    - 'execute console command "execute in %world% run summon minecraft:lightning_bolt %x% 250 %z%"'
    - 'execute console command "execute in %world% run summon minecraft:lightning_bolt %x% 250 %z%"'
    - 'execute console command "execute in %world% run summon minecraft:lightning_bolt %x% 250 %z%"'
    - 'execute console command "execute in %world% run summon minecraft:lightning_bolt %x% 250 %z%"'

# ============================================================
# STATE: RAGE
# ============================================================
rage:
  name: "&5&lC&d&le&b&ll&3&le&9&ls&b&lt&d&li&5&la&d&ll &b&lI&3&lv&9&lo&b&lr&d&ly"
  attack-cooldown-seconds: 0.3
  base-damage: 30000
  knockback:
    horizontal: 2.5
    vertical: 0.3
  duration-seconds: 30
  speed-multiplier: 0.8
  on-activate-script:
    - 'execute console command "execute in %world% run playsound minecraft:chaoscraft:ivory.stellarrage player @a %x% %y% %z% 1.0 1.0"'
    - 'execute console command "effect give %player% speed 30 2 true"'
  on-deactivate-script:
    - 'execute console command "effect clear %player% speed"'

