# ============================================================
# Fluffy Mode - Hostile Cat Variants
# ============================================================
# Built on top of KC's "Kingdom Cats" pack by Nocsy (mcmodels.net).
# Original pack ships peaceful MCPets cats. These variants reuse
# the same ModelEngine models but configure them as hostile mobs
# for FluffyMode. The original Nocsy_Cat-* pets are unaffected.
#
# All entries are tagged 'fluffy:managed' and 'fluffy:type:fluffy_cat'
# so FluffyMobAI's spawn listener picks them up and runs the
# fluffy_cat state machine (stalk -> wiggle -> pounce, triple-swipe).
# Animations: idle, walk, sit_loop, wiggling, prepare_attack, attack.
#
# Model attachment uses skill-based `model{mid=X}` (matching the
# canonical Nocsy/Nog pack approach) instead of `Modules.ModelEngine`.
# ============================================================

Fluffy_NocsyCat-Munchkin:
  Type: WOLF
  Display: '&fMunchkin Hunter'
  Health: 40
  Damage: 5.0
  Faction: fluffy
  AIGoalSelectors:
  - clear
  - 0 float
  AITargetSelectors:
  - clear
  Skills:
  - model{mid=nocsy_cat1;n=false} @self ~onSpawn
  - model{mid=nocsy_cat1;n=false} @self ~onLoad
  Options:
    MovementSpeed: 0.32
    PreventOtherDrops: true
    PreventSunburn: true
    Silent: true
    Despawn: true
    NoAI: false
    Collidable: true
    Persistent: false
  Tags:
  - fluffy:managed
  - fluffy:type:fluffy_cat
  - fluffy:variant:munchkin

