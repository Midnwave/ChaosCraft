# ============================================================
# Chain Mode - Custom Mob Definitions
# ============================================================
# 9 custom MythicMobs across 3 sub-vibes (industrial/cursed/spectral)
# All tagged `chain:wielder` so ChainAttackSystem fires their chain
# attack ability. Per-mob chain effect (PULL/SWING/SLAM/LAUNCH/ANCHOR/
# DAMAGE_ONLY) is set in chain.yml's mob-spawning pool, not here.
# ============================================================

# ============================================================
# INDUSTRIAL SUB-VIBE (iron/rust)
# ============================================================
# Heavy iron tanks and brutes. Spawn FX: large_smoke + iron block
# dust. Sounds: chain place, anvil clang, iron golem grunts, grindstone.
# ============================================================

ChainBrute:
  Type: WOLF
  Display: '&8&lChain Brute'
  Health: 80
  Damage: 16
  Faction: chain
  AIGoalSelectors:
  - clear
  - 0 float
  - 1 meleeattack
  - 2 lookatplayers
  - 3 randomstroll
  AITargetSelectors:
  - clear
  - 0 players
  Skills:
  - sound{s=block.chain.place;v=1.0;p=0.6} @self ~onSpawn
  - sound{s=block.anvil.land;v=0.8;p=0.7} @self ~onSpawn
  - effect:particles{particle=large_smoke;amount=20;hS=0.5;vS=0.3;speed=0.05} @self ~onSpawn
  - effect:particles{particle=block_crack;material=IRON_BLOCK;amount=15;hS=0.6;vS=0.4;speed=0.0} @self ~onSpawn
  - sound{s=entity.iron_golem.attack;v=0.9;p=0.7} @self ~onAttack
  - sound{s=entity.iron_golem.hurt;v=0.8;p=0.8} @self ~onDamaged
  - sound{s=block.grindstone.use;v=0.6;p=0.5} @self ~onTimer:140
  - effect:particles{particle=large_smoke;amount=4;hS=0.3;vS=0.2;speed=0.02} @self ~onTimer:80
  - sound{s=entity.iron_golem.death;v=1.0;p=0.7} @self ~onDeath
  Options:
    MovementSpeed: 0.22
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    PreventSunburn: true
    NoAI: false
    Collidable: true
    Persistent: false
    KnockbackResistance: 0.8
    FollowRange: 28
  Tags:
  - chaoscraft_chain
  - chain_brute
  - chain:wielder
  - chain:vibe:industrial
  Drops:
  - IRON_INGOT 0-2

