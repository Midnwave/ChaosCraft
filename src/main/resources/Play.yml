# ChaosCraft Play Configuration
# Scripts are executed when /cc play is used
# Messages are shown via %cc_play_status% placeholder

# Scripts executed by /cc play command
Scripts:
  # Executed when player hasn't accepted user agreement
  UserAgreementNotAccepted:
    - "message %player% &cYou must accept the user agreement to play the server."
    - "message %player% &7Please contact an administrator for assistance."
    - "message %player% &7Type &e/help &7for more information."

  # Executed when player has accepted user agreement
  PlayAccepted:
    - "message %player% &#FF0000&lW&#FF3300&lE&#FF6600&lL&#FF9900&lC&#FFCC00&lO&#FFFF00&lM&#CCFF00&lE"
    - "message %player% &7Preparing your nightmare..."
    - "message %player% &8The entity has taken notice of you."
    - "message %player% &c&lGood luck."

