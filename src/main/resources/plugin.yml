name: ChaosCraft
version: '${version}'
main: com.blockforge.chaoscraft.ChaosCraftPlugin
api-version: '1.21'
description: '${description}'
authors:
  - BlockForgeStudios
website: https://github.com/Midnwave/ChaosCraft

softdepend:
  - PlaceholderAPI
  - MythicMobs
  - ModelEngine
  - Citizens
  - ProtocolLib
  - packetevents
  - Vault
  - ItemsAdder
  - DynamicBackpacks

commands:
  # ===== Core Commands =====
  chaoscraft:
    description: Main ChaosCraft command hub
    aliases: [cc]
    usage: /cc <subcommand>
    permission: chaoscraft.use

  # ===== Mode Commands =====
  triggermode:
    description: Trigger a game mode
    usage: /triggermode <mode>
    permission: chaoscraft.mode.trigger
  endmode:
    description: End the active game mode
    usage: /endmode
    permission: chaoscraft.mode.end

  # ===== Chain Mode =====
  chain:
    description: Chain mode test and admin commands
    usage: /chain <subcommand> — use /chain for full help
    permission: chaoscraft.chain.admin

  # ===== Calamity Mode =====
  calamity:
    description: Calamity mode test and admin commands
    usage: /calamity <subcommand> — use /calamity for full help
    permission: chaoscraft.admin

  # ===== Performance =====
  ccperformance:
    description: MythicMobs performance limiter management
    aliases: [ccperf]
    usage: /ccperf <enable|disable|toggle|reload|status|set|cleanup|debug>
    permission: chaoscraft.performance.admin

  # ===== Mode Points =====
  points:
    description: Check Mode Points balance and leaderboard
    usage: /points [top|debug|reload]
    permission: chaoscraft.use

  # ===== Claims =====
  claim:
    description: Land claim management
    usage: /claim [show|info|list|delete|resize]
    permission: chaoscraft.claims.use
  trust:
    description: Grant trust to a player on your claim
    usage: /trust <player> [level]
    permission: chaoscraft.claims.use
  untrust:
    description: Remove trust from a player on your claim
    usage: /untrust <player>
    permission: chaoscraft.claims.use
  trustlist:
    description: List trusted players on the current claim
    usage: /trustlist
    permission: chaoscraft.claims.use
  claimblocks:
    description: Check or buy claim blocks
    usage: /claimblocks [buy <amount>]
    permission: chaoscraft.claims.use

  # ===== Celestial Ivory =====
  ivory:
    description: Celestial Ivory weapon commands
    usage: /ivory <give|state|ability|list|reload>
    permission: chaoscraft.ivory.test

  # ===== Shop =====
  shop:
    description: Open the server shop
    aliases: [market]
    usage: /shop
    permission: chaoscraft.shop.use

  # ===== Player-Facing =====
  settings:
    description: Open the player settings menu
    usage: /settings
    permission: chaoscraft.settings.use
  codes:
    description: Enter a promotional code
    usage: /codes
  itemtag:
    description: View and manage item tags
    usage: /itemtag <add|remove|list> [tag]
    permission: chaoscraft.itemtag.use

permissions:
  # ----- Core -----
  chaoscraft.use:
    description: Use the /cc command
    default: true
  chaoscraft.admin:
    description: Full ChaosCraft admin access (inherits all)
    default: op
    children:
      chaoscraft.use: true
      chaoscraft.mode.trigger: true
      chaoscraft.mode.end: true
      # NOTE: chaoscraft.mode.exempt is NOT included here — admins should take damage
      # during testing. Use /calamity toggleexempt to manually exempt specific players.
      chaoscraft.calamity.admin: true
      chaoscraft.chain.admin: true
      chaoscraft.devs: true
      chaoscraft.performance.admin: true
      chaoscraft.titlescreen: true
      chaoscraft.settings.admin: true
      chaoscraft.codes.create: true
      chaoscraft.useragreement.admin: true
      chaoscraft.play.admin: true
      chaoscraft.item.give: true
      chaoscraft.itemtag.add: true
      chaoscraft.itemtag.remove: true
      chaoscraft.itemtag.list: true
      chaoscraft.claims.admin: true
      chaoscraft.corruption.admin: true
      chaoscraft.ivory.test: true
      chaoscraft.badges.admin: true
      chaoscraft.shop.admin: true
      chaoscraft.function.badge: true
      chaoscraft.tutorial.admin: true

  # ----- Mode System -----
  chaoscraft.mode.trigger:
    description: Trigger game modes (/triggermode)
    default: op
  chaoscraft.mode.end:
    description: End active game mode (/endmode)
    default: op
  chaoscraft.mode.exempt:
    description: Exempt from mode attacks (no damage from events)
    default: false

  # ----- Tutorial Mode -----
  chaoscraft.tutorial.admin:
    description: Tutorial mode admin/test commands
    default: op

  # ----- Chain Mode -----
  chaoscraft.chain.admin:
    description: Chain mode admin/test commands
    default: op

  # ----- Calamity Mode -----
  chaoscraft.calamity.admin:
    description: Calamity mode admin/test commands
    default: op

  # ----- Developer -----
  chaoscraft.devs:
    description: Developer commands (/cc devs, /cc dog, /cc debug)
    default: op

  # ----- Performance -----
  chaoscraft.performance.admin:
    description: Manage MythicMobs performance limiter
    default: op
  chaoscraft.performance.bypass:
    description: Bypass performance limiter (ping cleanup, per-player limits)
    default: false

  # ----- Title Screen -----
  chaoscraft.titlescreen:
    description: Force players in/out of title screen
    default: op

  # ----- Settings -----
  chaoscraft.settings.use:
    description: Open settings menu (/settings)
    default: true
  chaoscraft.settings.admin:
    description: Manage other players' settings
    default: op

  # ----- Codes -----
  chaoscraft.codes.create:
    description: Create and manage promotional codes
    default: op

  # ----- User Agreement -----
  chaoscraft.useragreement.admin:
    description: Force-accept user agreements for players
    default: op

  # ----- Play -----
  chaoscraft.play.admin:
    description: Execute play scripts on players
    default: op

  # ----- Items -----
  chaoscraft.item.give:
    description: Give special items to players
    default: op

  # ----- Item Tags -----
  chaoscraft.itemtag.use:
    description: View item tags
    default: true
  chaoscraft.itemtag.add:
    description: Add tags to items
    default: op
  chaoscraft.itemtag.remove:
    description: Remove tags from items
    default: op
  chaoscraft.itemtag.list:
    description: List tags on items
    default: true

  # ----- Claims -----
  chaoscraft.claims.use:
    description: Use claim commands (/claim, /trust, /untrust, etc.)
    default: true
  chaoscraft.claims.admin:
    description: Admin claim management (/cc claims)
    default: op

  # ----- Ivory Weapon -----
  chaoscraft.ivory.test:
    description: Celestial Ivory admin/test commands
    default: op

  # ----- Corruption Mode -----
  chaoscraft.corruption.admin:
    description: Corruption mode admin/test commands
    default: op

  # ----- Stats -----
  chaoscraft.stats.view:
    description: View player stats (/cc kills)
    default: true

  # ----- Badges -----
  chaoscraft.badges.view:
    description: View own badges (/cc badges)
    default: true
  chaoscraft.badges.admin:
    description: Create/delete/assign/revoke badges
    default: op

  # ----- Shop -----
  chaoscraft.shop.use:
    description: Use the shop (/shop, /market, /cc shop)
    default: true
  chaoscraft.shop.admin:
    description: Admin shop management (edit, add items, sections)
    default: op

  # ----- Function: Badge -----
  chaoscraft.function.badge:
    description: Mark held items with badge_state PDC tags via /cc function set badge*item commands
    default: op
